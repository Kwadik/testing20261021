services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next: